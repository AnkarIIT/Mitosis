name: neet_mitos
description: "AI-Powered NEET Preparation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ML & AI
  tflite_flutter: ^0.12.1
  google_generative_ai: ^0.4.7
  groq: ^1.1.1
  
  # PDF Processing
  syncfusion_flutter_pdf: ^34.2.4
  syncfusion_flutter_pdfviewer: ^34.2.4
  file_picker: 12.0.0
  
  # State Management & Database
  flutter_riverpod: 2.5.1
  go_router: ^14.3.0
  drift: ^2.33.0
  sqlite3: ^3.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.2.0
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  internet_connection_checker: ^1.0.0+1
  
  # UI & UX Components
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  flutter_markdown: ^0.7.7+1
  confetti: ^0.7.0
  image_picker: ^1.2.2
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.18.1
  permission_handler: ^11.3.1
  crypto: ^3.0.7
  google_sign_in: ^6.2.1
  flutter_hooks: ^0.21.3+1
  state_notifier: ^1.0.0
  http: ^1.5.0
  local_auth: ^2.3.0
  flutter_image_compress: ^2.4.0
  timezone: ^0.10.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/ml/
    - assets/ncert_books/
    - assets/questions/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
